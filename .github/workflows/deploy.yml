name: Deploy Static Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site

          # Main homepage
          cp -R roamingnerds/home-one-page/. _site/

          # WordPress static assets
          cp -R roamingnerds/wp-content _site/
          cp -R roamingnerds/wp-includes _site/

          # Other static pages/content
          cp -R roamingnerds/about-us _site/ 2>/dev/null || true
          cp -R roamingnerds/blog _site/ 2>/dev/null || true
          cp -R roamingnerds/contact _site/ 2>/dev/null || true
          cp -R roamingnerds/service _site/ 2>/dev/null || true
          cp -R roamingnerds/team _site/ 2>/dev/null || true
          cp -R roamingnerds/pricing _site/ 2>/dev/null || true
          cp -R roamingnerds/project _site/ 2>/dev/null || true
          cp -R roamingnerds/faq _site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4