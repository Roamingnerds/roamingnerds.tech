name: Deploy Static Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Configure GitHub Pages
      # --------------------------------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # --------------------------------------------------
      # 3. Build static website
      # --------------------------------------------------
      - name: Prepare website
        shell: bash
        run: |
          set -e

          echo "Creating website directory..."
          rm -rf _site
          mkdir -p _site

          echo "Copying homepage..."
          cp -R roamingnerds/home-one-page/. _site/

          # ------------------------------------------------
          # WordPress static assets
          # ------------------------------------------------
          echo "Copying wp-content..."
          if [ -d "roamingnerds/wp-content" ]; then
            cp -R roamingnerds/wp-content _site/
          fi

          echo "Copying wp-includes..."
          if [ -d "roamingnerds/wp-includes" ]; then
            cp -R roamingnerds/wp-includes _site/
          fi

          # ------------------------------------------------
          # Copy additional static pages/directories
          # ------------------------------------------------
          for dir in \
            about-us \
            blog \
            contact \
            service \
            services \
            team \
            pricing \
            project \
            projects \
            faq
          do
            if [ -d "roamingnerds/$dir" ]; then
              echo "Copying $dir..."
              cp -R "roamingnerds/$dir" "_site/"
            fi
          done

          # ------------------------------------------------
          # Fix URLs generated by local WordPress
          # ------------------------------------------------
          echo "Fixing localhost URLs..."

          find _site -type f \( \
            -name "*.html" \
            -o -name "*.htm" \
            -o -name "*.css" \
            -o -name "*.js" \
            -o -name "*.json" \
            -o -name "*.xml" \
            -o -name "*.svg" \
            -o -name "*.txt" \
          \) -print0 | while IFS= read -r -d '' file
          do
            sed -i \
              's#http://localhost/roamingnerds#https://roamingnerds.tech#g' \
              "$file"

            sed -i \
              's#https://localhost/roamingnerds#https://roamingnerds.tech#g' \
              "$file"

            sed -i \
              's#http://localhost#https://roamingnerds.tech#g' \
              "$file"

            sed -i \
              's#https://localhost#https://roamingnerds.tech#g' \
              "$file"
          done

          # ------------------------------------------------
          # Fix common WordPress local paths
          # ------------------------------------------------
          echo "Fixing WordPress local paths..."

          find _site -type f \( \
            -name "*.html" \
            -o -name "*.htm" \
            -o -name "*.css" \
            -o -name "*.js" \
            -o -name "*.json" \
            -o -name "*.xml" \
          \) -print0 | while IFS= read -r -d '' file
          do
            sed -i \
              's#//localhost/roamingnerds/#https://roamingnerds.tech/#g' \
              "$file"

            sed -i \
              's#/roamingnerds/wp-content/#/wp-content/#g' \
              "$file"

            sed -i \
              's#/roamingnerds/wp-includes/#/wp-includes/#g' \
              "$file"

            sed -i \
              's#/roamingnerds/wp-json/#/wp-json/#g' \
              "$file"

            sed -i \
              's#/roamingnerds/wp-admin/#/wp-admin/#g' \
              "$file"
          done

          # ------------------------------------------------
          # Display generated website structure
          # ------------------------------------------------
          echo ""
          echo "=========================================="
          echo "Generated website:"
          echo "=========================================="

          find _site -maxdepth 2 -type f | head -100

          echo ""
          echo "=========================================="
          echo "Checking homepage:"
          echo "=========================================="

          if [ -f "_site/index.html" ]; then
            echo "✓ index.html exists"
          else
            echo "✗ ERROR: index.html not found"
            exit 1
          fi

      # --------------------------------------------------
      # 4. Upload GitHub Pages artifact
      # --------------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      # --------------------------------------------------
      # 5. Deploy
      # --------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4